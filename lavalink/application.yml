server:
  port: 2333
  address: "0.0.0.0"

lavalink:
  server:
    password: "youshallnotpass"

    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false

    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    trackStuckThresholdMs: 10000
    playerUpdateInterval: 5

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      snapshot: true

    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    remoteCipher:
      url: "http://yt-cipher.railway.internal:8001"
      password: "GMAO-CIPHER-2026-SECRET"
      userAgent: "DEATH-Music-24-7"

    # Use playback-capable clients only. MUSIC is search-only and TV
    # requires OAuth for playback, so neither should be relied on for audio.
    clients:
      - ANDROID_VR
      - ANDROID_MUSIC
      - MWEB
      - WEB
      - WEBEMBEDDED
      - IOS
      - MUSIC

    clientOptions:
      ANDROID_VR:
        searching: true
        playback: true
        playlistLoading: true
        videoLoading: true

      ANDROID_MUSIC:
        searching: true
        playback: true
        playlistLoading: false
        videoLoading: true

      MWEB:
        searching: true
        playback: true
        playlistLoading: true
        videoLoading: true

      WEB:
        searching: true
        playback: true
        playlistLoading: true
        videoLoading: true

      WEBEMBEDDED:
        searching: false
        playback: true
        playlistLoading: false
        videoLoading: true

      IOS:
        searching: true
        playback: true
        playlistLoading: true
        videoLoading: true

      MUSIC:
        searching: true
        playback: false
        playlistLoading: false
        videoLoading: false

  lavasrc:
    providers:
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"

    sources:
      youtube: false
      spotify: false
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
      jiosaavn: false

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
    dev.lavalink.youtube.cipher.LocalSignatureCipherManager: INFO
    com.github.topi314.lavasrc: INFO
