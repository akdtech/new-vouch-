# Force the YouTube plugin client list at a higher-precedence config level.
# Spring Boot properties override the YAML list when both are present.
plugins.youtube.clients[0]=ANDROID_MUSIC
plugins.youtube.clients[1]=ANDROID_VR
plugins.youtube.clients[2]=WEB
plugins.youtube.clients[3]=IOS
plugins.youtube.clients[4]=MUSIC

# Keep only playback-capable clients enabled for track loading.
plugins.youtube.clientOptions.ANDROID_MUSIC.playback=true
plugins.youtube.clientOptions.ANDROID_MUSIC.searching=true
plugins.youtube.clientOptions.ANDROID_MUSIC.videoLoading=true
plugins.youtube.clientOptions.ANDROID_MUSIC.playlistLoading=false

plugins.youtube.clientOptions.ANDROID_VR.playback=true
plugins.youtube.clientOptions.ANDROID_VR.searching=true
plugins.youtube.clientOptions.ANDROID_VR.videoLoading=true
plugins.youtube.clientOptions.ANDROID_VR.playlistLoading=true

plugins.youtube.clientOptions.WEB.playback=true
plugins.youtube.clientOptions.WEB.searching=true
plugins.youtube.clientOptions.WEB.videoLoading=true
plugins.youtube.clientOptions.WEB.playlistLoading=true

plugins.youtube.clientOptions.IOS.playback=true
plugins.youtube.clientOptions.IOS.searching=true
plugins.youtube.clientOptions.IOS.videoLoading=true
plugins.youtube.clientOptions.IOS.playlistLoading=true

plugins.youtube.clientOptions.MUSIC.playback=false
plugins.youtube.clientOptions.MUSIC.searching=true
plugins.youtube.clientOptions.MUSIC.videoLoading=false
plugins.youtube.clientOptions.MUSIC.playlistLoading=false
